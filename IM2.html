<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Document Request & Appointment System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#6366f1;
    --primary-dark:#4f46e5;
    --accent:#ec4899;
    --success:#10b981;
    --warning:#f59e0b;
    --danger:#ef4444;
    --bg:#eef1fb;
    --card:#ffffff;
    --text:#1e1b32;
    --muted:#5c6178;
    --border:#e5e7eb;
    --radius:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(30,27,50,.06), 0 1px 3px rgba(30,27,50,.05);
    --shadow-md:0 4px 12px rgba(79,70,229,.10), 0 2px 4px rgba(30,27,50,.06);
    --shadow-lg:0 12px 28px rgba(79,70,229,.16), 0 4px 10px rgba(30,27,50,.08);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;color:var(--text);
    background:
      radial-gradient(1100px 500px at 100% -10%, rgba(236,72,153,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 0%, rgba(99,102,241,.14), transparent 55%),
      var(--bg);
    min-height:100vh;
    animation:pageFadeIn .4s var(--ease);
    text-align:center;
  }
  @keyframes pageFadeIn{from{opacity:0;}to{opacity:1;}}

  /* --- FORM SIZE ADJUSTMENT --- */
  form {
    max-width: 640px;   /* expanded form container */
    width: 100%;
    margin: 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  input, select, textarea {
    text-align:center;
    max-width:600px;    /* expanded from 420px */
    margin-left:auto;
    margin-right:auto;
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--border);
    border-radius:10px;
    font-size:14px;
    margin-bottom:12px;
    background:#fbfbfe;
    color:var(--text);
    font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(99,102,241,.15);
    background:#fff;
  }

  /* Buttons adjusted to match wider form */
  .btn{
    background:linear-gradient(120deg,var(--primary),var(--primary-dark));
    color:#fff;border:none;
    padding:11px 20px;
    min-height:42px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    box-shadow:0 2px 8px rgba(79,70,229,.3);
    transition:transform .12s var(--ease), box-shadow .12s var(--ease), opacity .12s ease, filter .12s ease;
    width:100%;          /* button stretches to form width */
    max-width:600px;     /* aligned with input width */
    margin:0 auto;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,70,229,.35);filter:brightness(1.03);}
  .btn:active{transform:translateY(0);filter:brightness(.98);}
</style>
</head>
<body>

<header>
  <h1>School Document Request & Appointment System</h1>
</header>

<main>
  <div class="card">
    <h2>Request a Document</h2>
    <form>
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">

      <label for="document">Document Type</label>
      <select id="document" name="document">
        <option value="">Select a document</option>
        <option value="transcript">Transcript</option>
        <option value="certificate">Certificate</option>
        <option value="id">School ID</option>
      </select>

      <label for="appointment">Preferred Appointment Date</label>
      <input type="date" id="appointment" name="appointment">

      <button type="submit" class="btn">Submit Request</button>
    </form>
  </div>
</main>

</body>
</html>
